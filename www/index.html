<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Omni 2D</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button id="importBtn" class="btn btn--flourish" type="button">Import</button>
      <div id="logo" class="logo">&#8734;omni-2D</div>
      <div id="modeLabel" class="mode-label" hidden>
        <span class="mode-label__dot" aria-hidden="true"></span>
        <span id="modeLabelText">Animate Mode</span>
      </div>
    </header>

    <main id="canvasWrap" class="canvas-wrap">
      <canvas id="canvas" class="canvas"></canvas>
      <p id="canvasEmptyHint" class="canvas-empty-hint">
        No rig loaded yet.<br />Tap Import to add character parts.
      </p>
      <!--
        FUTURE HOOK: bone/mesh/skeleton rendering, drag-handle overlays,
        and animation playback will draw onto #canvas via js/canvas.js.
        This screen intentionally shows a blank canvas for now.
      -->
    </main>

    <input id="fileInput" class="visually-hidden" type="file" accept="image/png,.png" multiple />

    <footer class="controls">
      <div id="scenePanel" class="scene-panel" hidden>
        <div id="selectionBar" class="selection-bar" hidden>
          <span id="selectedPartName" class="selection-bar__name"></span>
          <button id="toFrontBtn" class="btn btn--sm" type="button">To Front</button>
          <button id="toBackBtn" class="btn btn--sm" type="button">To Back</button>
        </div>

        <button id="scenePanelToggle" class="scene-panel__header" type="button" aria-expanded="true" aria-controls="scenePartsList">
          <span>Scene Parts (<span id="scenePartsCount">0</span>)</span>
          <span id="scenePanelChevron" class="scene-panel__chevron" aria-hidden="true">&#9662;</span>
        </button>

        <ul id="scenePartsList" class="scene-parts"></ul>
      </div>

      <p id="rigHint" class="rig-hint" hidden></p>

      <div id="rigPanel" class="scene-panel" hidden>
        <div id="boneEditor" class="bone-editor" hidden>
          <div class="bone-editor__row">
            <input id="boneNameInput" class="text-input text-input--inline" type="text" aria-label="Bone name" autocomplete="off" />
            <button id="deleteBoneBtn" class="btn btn--sm btn--danger" type="button">Delete</button>
          </div>
          <p id="boneReadout" class="bone-readout"></p>
          <div class="bone-editor__row bone-editor__nudges">
            <button id="nudgeLeftBtn" class="btn btn--nudge" type="button" aria-label="Move bone left">&#8592;</button>
            <button id="nudgeUpBtn" class="btn btn--nudge" type="button" aria-label="Move bone up">&#8593;</button>
            <button id="nudgeDownBtn" class="btn btn--nudge" type="button" aria-label="Move bone down">&#8595;</button>
            <button id="nudgeRightBtn" class="btn btn--nudge" type="button" aria-label="Move bone right">&#8594;</button>
            <button id="rotateCcwBtn" class="btn btn--nudge" type="button" aria-label="Rotate bone counter-clockwise">&#8634;</button>
            <button id="rotateCwBtn" class="btn btn--nudge" type="button" aria-label="Rotate bone clockwise">&#8635;</button>
          </div>
        </div>

        <button id="skeletonToggle" class="scene-panel__header" type="button" aria-expanded="true" aria-controls="boneList">
          <span>Skeleton (<span id="boneCount">0</span>)</span>
          <span id="skeletonChevron" class="scene-panel__chevron" aria-hidden="true">&#9662;</span>
        </button>

        <ul id="boneList" class="scene-parts"></ul>
      </div>

      <div id="rigControls" class="control-row" hidden>
        <button id="rigExitBtn" class="btn btn--icon" type="button" aria-label="Exit rig mode">&#10005;</button>
        <button id="addBoneBtn" class="btn btn--flourish" type="button">Add Bone</button>
      </div>

      <div id="homeControls" class="control-row">
        <button id="rigBtn" class="btn btn--lg btn--flourish" type="button">Rig</button>
        <button id="animateBtn" class="btn btn--lg btn--flourish-4" type="button">
          <span class="flourish flourish--tl" aria-hidden="true">&#10047;</span>
          <span class="flourish flourish--tr" aria-hidden="true">&#10047;</span>
          Animate
          <span class="flourish flourish--bl" aria-hidden="true">&#10047;</span>
          <span class="flourish flourish--br" aria-hidden="true">&#10047;</span>
        </button>
      </div>

      <div id="animateControls" class="control-row" hidden>
        <button id="exitBtn" class="btn btn--icon" type="button" aria-label="Exit animate mode">&#10005;</button>
        <button id="startBtn" class="btn btn--flourish" type="button" disabled>Start</button>
        <button id="stopBtn" class="btn btn--flourish" type="button" disabled>Stop</button>
      </div>
    </footer>

    <div id="exportModal" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
        <h2 id="exportTitle" class="modal__title">Export Animation</h2>

        <label for="filenameInput" class="field-label">Filename</label>
        <input id="filenameInput" class="text-input" type="text" placeholder="animation_01" autocomplete="off" />

        <div class="modal__actions">
          <button id="saveGifBtn" class="btn btn--flourish" type="button">Save as GIF</button>
          <button id="saveMp4Btn" class="btn btn--flourish" type="button">Save as MP4</button>
        </div>

        <button id="cancelExportBtn" class="btn btn--cancel" type="button">Cancel</button>
      </div>
    </div>

    <div id="confirmModal" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <h2 id="confirmTitle" class="modal__title">Delete bone?</h2>
        <p id="confirmMessage" class="modal__text"></p>
        <div class="modal__actions">
          <button id="confirmDeleteBtn" class="btn btn--danger" type="button">Delete</button>
          <button id="confirmCancelBtn" class="btn" type="button">Keep</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
